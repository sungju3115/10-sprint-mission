upstream backend {
    # ── 로드밸런싱 전략 ─────────────────────────────────────────
    # 1. Round Robin (기본값): 요청을 순서대로 각 서버에 분산
    server app:8081;

    # 2. Least Connections: 현재 연결 수가 가장 적은 서버로 요청
    # least_conn;
    # server app:8081;

    # 3. IP Hash: 클라이언트 IP를 기반으로 항상 같은 서버로 라우팅 (세션 유지)
    # ip_hash;
    # server app:8081;

    # 4. Weight: 서버에 가중치를 부여해 트래픽 비율 조정
    # server app:8081 weight=3;
}

server {
    listen 80;

    # /api/sse/* → SSE (버퍼링 반드시 off)
    location ^~ /api/sse {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream-Server $upstream_addr;
    }

    # /api/* → 백엔드 컨테이너로 프록시
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream-Server $upstream_addr;
    }

    # /ws/* → WebSocket 프록시
    location ^~ /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        add_header X-Upstream-Server $upstream_addr;
    }

    # 그 외 모든 요청 → 프론트엔드 정적 리소스 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
